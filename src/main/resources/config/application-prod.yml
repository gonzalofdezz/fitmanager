# Perfil de producción - Railway
spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  h2:
    console:
      enabled: false

logging:
  level:
    org.hibernate.SQL: warn
    root: warn

# CORS - añadir la URL del frontend desplegado en Railway/Vercel/Netlify
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5177,http://localhost:3000}

# Actuator - healthcheck para Railway
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
